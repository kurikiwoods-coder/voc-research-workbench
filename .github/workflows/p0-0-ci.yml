name: P0-0 engineering checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      browser:
        description: Run Chromium browser checks
        type: boolean
        default: false

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run Python suite, three cold starts, and secret scan
        shell: bash
        run: |
          mkdir -p test-results
          set -o pipefail
          bash scripts/smoke-test.sh 2>&1 | tee test-results/smoke.log
      - name: Verify the committed archived receipts
        shell: bash
        run: |
          set -o pipefail
          python -m src.outputs.audit_receipt --verify docs/evidence/p0-0 | tee test-results/archived-receipt.json
          python -m src.outputs.audit_receipt --verify docs/evidence/p0-0/regression | tee test-results/regression-receipt.json
          python -m src.outputs.audit_receipt --verify docs/evidence/p0-0/api-setup/live-receipt | tee test-results/api-setup-receipt.json
          python -m src.outputs.audit_receipt --verify docs/evidence/p0-0/tavily-live | tee test-results/tavily-live-receipt.json
      - name: Start the shipped .cmd from an extracted Windows path
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $logs = (Resolve-Path test-results).Path
          $project = Join-Path $env:RUNNER_TEMP 'VOC Workbench 研究'
          $archive = Join-Path $env:RUNNER_TEMP 'voc-source.zip'
          git archive --format=zip "--output=$archive" HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Could not create the source ZIP' }
          Expand-Archive -LiteralPath $archive -DestinationPath $project
          $env:VOC_DATA_DIR = Join-Path $project 'cold-start database'
          $launch = @{
            FilePath = $env:ComSpec
            ArgumentList = @('/d', '/c', 'scripts\start-windows.cmd')
            WorkingDirectory = $project
            RedirectStandardOutput = Join-Path $logs 'windows-launcher-stdout.log'
            RedirectStandardError = Join-Path $logs 'windows-launcher-stderr.log'
            PassThru = $true
          }
          $process = Start-Process @launch
          try {
            $deadline = [DateTime]::UtcNow.AddMinutes(6)
            $health = $null
            while ([DateTime]::UtcNow -lt $deadline) {
              if ($process.HasExited) { throw "start-windows.cmd exited with $($process.ExitCode)" }
              try {
                $health = Invoke-RestMethod http://127.0.0.1:8765/api/health -TimeoutSec 2
                break
              } catch {
                Start-Sleep -Seconds 1
              }
            }
            if ($health.status -ne 'ok' -or $health.schema_version -ne 7) { throw 'API startup failed' }
            $workspace = Invoke-RestMethod http://127.0.0.1:8765/api/workspace -TimeoutSec 5
            if ($null -eq $workspace.history -or @($workspace.history).Count -ne 0) {
              throw 'Cold-start database should be empty'
            }
            $page = Invoke-WebRequest http://127.0.0.1:8765/ -TimeoutSec 5
            if ($page.StatusCode -ne 200) { throw 'Local home page failed' }
            if (!(Test-Path -LiteralPath (Join-Path $env:VOC_DATA_DIR 'connectivity.sqlite3'))) {
              throw 'The launcher did not create the expected SQLite database'
            }
            "Windows .cmd startup: PASS on $env:RUNNER_OS" | Tee-Object -FilePath (Join-Path $logs 'windows-launcher-result.log')
          } finally {
            if (!$process.HasExited) {
              taskkill.exe /PID $process.Id /T /F
              if ($LASTEXITCODE -ne 0 -and !$process.HasExited) { throw 'Could not stop the launcher' }
              $global:LASTEXITCODE = 0
            }
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: smoke-${{ matrix.os }}
          path: test-results/
          if-no-files-found: warn

  chromium:
    if: github.event_name == 'pull_request' || inputs.browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Install Chromium and test dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Run the real localhost browser tests
        shell: bash
        run: |
          mkdir -p test-results
          set -o pipefail
          python tests/browser_e2e.py 2>&1 | tee test-results/browser.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: chromium-evidence
          path: test-results/
          if-no-files-found: warn
